<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажер дзвінків AllRight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9FD;--surface:#fff;--ink:#1D1630;--muted:#675F7C;--line:#E4DEF0;
  --violet:#9A00FF;--violet-ink:#6C00B4;--violet-soft:#F1E6FF;
  --call:#1E0F38;--call-ink:#F3ECFF;--call-muted:#B7A8D6;--bad:#BE2D48;
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#120D1D;--surface:#1B1529;--ink:#EEE9F8;--muted:#A79FBD;--line:#2F2742;
  --violet:#B54DFF;--violet-ink:#D29BFF;--violet-soft:#2B1A45;--call:#0B0614;--bad:#FF7A93;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#120D1D;--surface:#1B1529;--ink:#EEE9F8;--muted:#A79FBD;--line:#2F2742;
  --violet:#B54DFF;--violet-ink:#D29BFF;--violet-soft:#2B1A45;--call:#0B0614;--bad:#FF7A93;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:32px clamp(16px,4vw,40px) 56px}
header.top{display:flex;align-items:baseline;gap:12px;margin-bottom:26px}
.brand{font-family:var(--display);font-weight:700;font-size:18px}
.brand span{color:var(--muted);font-family:var(--font);font-weight:500;font-size:13px;margin-left:8px}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.015em}
.lede{color:var(--muted);margin:0 0 24px;max-width:64ch}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:26px}
.pick{display:flex;flex-direction:column;gap:8px}
.pickitem{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;cursor:pointer}
.pickitem:has(input:checked){border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}
.pickitem input{margin-top:4px;accent-color:var(--violet)}
.pickitem .g{font-size:13.5px;color:var(--muted);margin-top:4px}
.opts{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px 18px;align-self:start}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 11px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff;width:100%;margin-top:16px}
.btn.primary:hover{background:var(--violet-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.check input{accent-color:var(--violet)}
.note{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;color:var(--muted);max-width:70ch}
.err{color:var(--bad)}
.call{display:grid;grid-template-columns:320px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:calc(100dvh - 160px)}
.side{background:var(--call);color:var(--call-ink);padding:26px 24px;display:flex;flex-direction:column;gap:18px}
.lbl{font-size:12.5px;color:var(--call-muted);font-weight:500}
.mom{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2}
.live{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.orb{width:14px;height:14px;border-radius:50%;background:#7B6A9C}
.orb.listening{background:#3BE38F;animation:pulse 1.8s infinite}
.orb.speaking{background:#C07CFF;animation:pulse 0.9s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,124,255,.55)}70%{box-shadow:0 0 0 12px rgba(192,124,255,0)}100%{box-shadow:0 0 0 0 rgba(192,124,255,0)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none!important}}
.state{font-size:14px;color:var(--call-muted)}
.guid{font-size:14px;line-height:1.55;white-space:pre-wrap;opacity:.92}
.endbtn{margin-top:auto;border:0;border-radius:999px;background:#E5334F;color:#fff;font-weight:600;padding:14px 18px;cursor:pointer;font-size:15px}
.endbtn:hover{background:#C9213C}
.main{background:var(--surface);padding:24px clamp(16px,3vw,32px);overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.turn{display:grid;grid-template-columns:76px 1fr;gap:12px;max-width:76ch}
.turn .sp{font-size:12.5px;font-weight:600;color:var(--muted)}
.turn.agent .sp{color:var(--violet-ink)}
.hidden-tr{color:var(--muted);max-width:56ch}
.guid,.g,.turn div,.pickitem b{unicode-bidi:plaintext}
.done h1{margin-top:8px}
header.top{align-items:center;flex-wrap:wrap}
header.top .btn{padding:7px 12px;font-weight:500}
.rlist{display:flex;flex-direction:column;gap:8px;max-width:820px}
.ritem{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.ritem:hover{border-color:var(--violet)}
.sc{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sc.hi{color:#0D7F57}.sc.mid{color:#B7791F}.sc.lo{color:var(--bad)}
.muted{color:var(--muted);font-size:13.5px}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px 18px;margin-bottom:14px;max-width:820px}
.panel ul{margin:6px 0 0;padding-left:18px}.panel li{margin:4px 0}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.mk{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.mk.y{background:#E2F5EC;color:#0D7F57}.mk.n{background:#FBE7EB;color:var(--bad)}.mk.u{background:var(--line);color:var(--muted)}
.ev{font-size:13.5px;color:var(--muted);margin-top:2px;unicode-bidi:plaintext}
.team{max-width:820px;margin:-6px 0 22px}.teambar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 4px}.teambar span{display:block;height:100%;background:var(--violet)}
.mic{display:flex;align-items:center;gap:8px}.micbar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}.micbar span{display:block;height:100%;width:0;background:#7CE0B0;transition:width .15s}
.micwarn{font-size:13px;color:#FFD27A;line-height:1.4}
.task{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:16px 18px;max-width:820px}
.task.late,.task.lo{border-color:var(--bad)}.task.ok{opacity:.8}
.task-main .muted{margin-top:4px;unicode-bidi:plaintext}
.task-meta{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
.task-act{display:flex;flex-direction:column;gap:8px;min-width:180px}
.tstat{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--violet-soft);color:var(--violet-ink)}
.tstat.ok{background:#E2F5EC;color:#0D7F57}.tstat.mid{background:#FFF4D6;color:#8A5A00}.tstat.lo,.tstat.late{background:#FBE7EB;color:var(--bad)}.tstat.wait{background:var(--line);color:var(--muted)}
@media (max-width:640px){.task{grid-template-columns:1fr}}
.big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:500}
@media (max-width:860px){.grid,.call{grid-template-columns:1fr}.side{padding:18px}}
</style>
</head>

  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i)^kb[i%kb.length];
  const plain=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(plain);
}
function decode(b64,key){const bin=atob(b64.trim());const kb=new TextEncoder().encode(key);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i)^kb[i%kb.length];return JSON.parse(new TextDecoder().decode(out))}

const MARKET_LANG=[["AR","ar"],["HE","he"],["RO","ro"],["PL","pl"],["IT","it"],["SR","sr"],["ES","es"],["CS","cs"],["SK","sk"],["EE","ua"],["EN","en"]];
const DAY=864e5;
function mondayOf(ms){const d=new Date(ms);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function weekStartMs(iso){const p=iso.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).getTime()}
function me_(){return S.people.find(p=>p.id===S.whoId)||null}
function defaultLang(sc){const p=me_();const ls=Object.keys(sc.langs);const mk=(p&&p.market||"").toUpperCase();for(const [m,l] of MARKET_LANG){if(mk.includes(m)&&ls.includes(l))return l}return ls[0]}
function myTasks(){
  if(!S.whoId)return[];
  const now=Date.now(),thisMon=mondayOf(now);
  const res=R.list||[],pend=R.pending||[];
  return S.plan.filter(x=>x.personId===S.whoId&&weekStartMs(x.week)<=now).map(x=>{
    const sc=S.scns.find(s=>s.id===x.scenarioId);if(!sc)return null;
    const ws=weekStartMs(x.week);const start=x.at&&x.at>ws?x.at:ws;const deadline=start+2*DAY;
    const mine=res.filter(r=>r.scenario_id===x.scenarioId&&(r.started_at||0)>=start-60000);
    const best=mine.length?Math.max(...mine.map(r=>r.score)):null;
    const waiting=pend.some(c=>c.scenario_id===x.scenarioId&&(c.started_at||0)>=start-60000);
    let st;
    if(best!=null&&best>=80)st={k:"ok",t:T.stOk+" ✓",d:best};
    else if(waiting)st={k:"wait",t:T.stWait};
    else if(best!=null)st={k:best>=60?"mid":"lo",t:(best>=60?T.stMid:T.stLo)+" ("+best+")"};
    else st={k:now>deadline?"late":"todo",t:now>deadline?T.stLate:T.stTodo};
    return{...x,sc,start,deadline,st,current:ws===thisMon};
  }).filter(Boolean).filter(t=>t.current||t.st.k!=="ok").sort((a,b)=>a.deadline-b.deadline);
}

    body=ts.length?`<div class="rlist">${ts.map(t=>{const key=t.scenarioId+"|"+t.week+"|"+(t.slot||"main");const ls=Object.keys(t.sc.langs);const dl=defaultLang(t.sc);const nm=t.sc.langs[dl].name;
      return`<div class="task ${t.st.k}"><div class="task-main">${t.slot==="buddy"?`<span class="tstat" style="margin-right:6px">${T.buddyTag}</span>`:t.slot==="extra"?`<span class="tstat" style="margin-right:6px">${T.extraTag}</span>`:""}<b>${esc(nm)}</b><div class="muted">${esc(t.sc.langs[dl].guidelines)}</div>
        ${(()=>{const g=[...new Set(((t.sc.langs[dl].check||{}).items||[]).map(i=>i.group).filter(Boolean))];return g.length?`<div class="muted" style="margin-top:8px">${T.checks} ${g.map(esc).join(" · ")}</div>`:""})()}
        <div class="task-meta"><span class="tstat ${t.st.k}">${esc(t.st.t)}</span><span class="muted">${T.deadline} ${fmtD(t.deadline)}</span></div></div>
        <div class="task-act">${ls.length>1?`<select class="inp" data-tlang="${esc(key)}" aria-label="${T.lang}">${ls.map(l=>`<option value="${l}" ${l===dl?"selected":""}>${LANGS[l]||l}</option>`).join("")}</select>`:`<input type="hidden" data-tlang="${esc(key)}" value="${dl}">`}
        <button class="btn primary" data-task="${esc(key)}" style="margin-top:0">${t.st.k==="ok"?T.callAgain:T.start}</button></div></div>`}).join("")}</div>`
      :`<p class="lede">${T.noTasks}</p>`;
    if(R.err)body+=`<p class="err">${esc(R.err)}</p>`;}
  const meP=me_();let team="";
  if(meP&&TEAM.list){const mon=mondayOf(Date.now());const mates=new Set(S.people.filter(p=>p.dept===meP.dept&&!p.test).map(p=>p.id));
    const planned=S.plan.filter(x=>weekStartMs(x.week)===mon&&mates.has(x.personId));
    const passed=planned.filter(x=>TEAM.list.some(r=>r.admin_id===x.personId&&r.scenario_id===x.scenarioId)).length;
    if(planned.length){const pc=Math.round(passed/planned.length*100);team=`<div class="team"><div class="muted">${T.teamTitle} · ${meP.dept==="methodists"?T.dMeth:T.dSales}</div><div class="teambar"><span style="width:${pc}%"></span></div><div class="muted">${T.teamOf.replace("{a}",passed).replace("{b}",planned.length)}</div></div>`}}
  $("#app").innerHTML=`<h1>${T.homeTitle}</h1><p class="lede">${T.homeLede}</p>${team}
   <div style="max-width:420px;margin-bottom:22px"><label class="fl" for="whoSel">${T.who}</label>${whoField()}</div>${body}
   ${S.whoId?`<label class="check" style="margin-top:18px"><input type="checkbox" id="showTr" ${S.showTr?"checked":""}>${T.showTr}</label>`:""}`;
}
</script>
</body>
</html>
